name: fetchcord
version: git
summary: FetchCord
grade: devel
description: |
  FetchCord grabs your OS info and displays it as Discord Rich Presence.

  Prefer pip or Homebrew. This file is kept so
  existing snap listings do not break the repo layout.
base: core24
confinement: classic

parts:
  fetchcord:
    plugin: python
    source: .
    python-packages:
      - pypresence
      - psutil
      - PyYAML

apps:
  fetchcord:
    command: bin/fetchcord
