[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FetchCord"
version = "3.0.0"
description = "Display system information as Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["distro", "info", "discord", "fetch", "rich-presence"]
authors = [
    {name = "FetchCord team", email = "contact@fetchcord.org"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "pypresence>=4.3.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/fetchcord/FetchCord"
Documentation = "https://github.com/fetchcord/FetchCord#readme"
Repository = "https://github.com/fetchcord/FetchCord.git"
Issues = "https://github.com/fetchcord/FetchCord/issues"
Changelog = "https://github.com/fetchcord/FetchCord/releases"

[project.scripts]
fetchcord = "fetch_cord.__main__:main"

[tool.setuptools]
packages = ["fetch_cord"]
include-package-data = true

[tool.setuptools.package-data]
fetch_cord = [
    "resources/scripts/**/*",
    "resources/*.yml",
    "resources/*.conf",
    "resources/*.py",
    "resources/*.json",
    "native/**/*.py",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S"]  # Don't check security in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
